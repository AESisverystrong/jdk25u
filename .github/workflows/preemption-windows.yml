name: Windows Old Preemption JDK

on:
  push:
    branches:
      - pr/old-preemption-windows

permissions:
  contents: read

env:
  # Keep the same MSYS2 environment used by OpenJDK's build-windows.yml.
  MSYS2_PATH_TYPE: minimal
  CHERE_INVOKING: 1

jobs:
  build-windows:
    name: windows-x64
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      # The delivery kit needs the release JDK only. The build steps below are
      # the upstream OpenJDK Windows workflow steps for this exact baseline.
      matrix:
        debug-level: [release]
        include:
          - debug-level: debug
            flags: --with-debug-level=fastdebug
            suffix: -debug
    steps:
      # Delivery-only prelude: fetch the tiny branch so the patch can be saved
      # outside the workspace before the upstream checkout replaces it.
      - name: 'Force LF Git checkouts'
        shell: cmd
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: 'Checkout tiny builder branch'
        uses: actions/checkout@v6

      - name: 'Export patch blob without Windows newline conversion'
        shell: cmd
        run: git show HEAD:old-preemption.patch > "%RUNNER_TEMP%\old-preemption.patch"

      # Upstream build-windows.yml starts here. The checkout is pinned to the
      # exact OpenJDK baseline that old-preemption.patch was generated from.
      - name: 'Checkout the JDK source'
        uses: actions/checkout@v6
        with:
          repository: openjdk/jdk25u
          ref: 1fac148c2dcc5c2f065999ff3562a76e3c699d0f
          persist-credentials: false
          clean: true

      # The only injected source-modification step.
      - name: 'Apply Old preemption patch'
        shell: cmd
        run: |
          git apply --check "%RUNNER_TEMP%\old-preemption.patch"
          git apply "%RUNNER_TEMP%\old-preemption.patch"

      - name: 'Get MSYS2'
        uses: ./.github/actions/get-msys2

      - name: 'Get the BootJDK'
        id: bootjdk
        uses: ./.github/actions/get-bootjdk
        with:
          platform: windows-x64


      - name: 'Check toolchain installed'
        id: toolchain-check
        run: |
          set +e
          '/c/Program Files/Microsoft Visual Studio/2022/Enterprise/vc/auxiliary/build/vcvars64.bat' -vcvars_ver=14.44
          if [ $? -eq 0 ]; then
            echo "Toolchain is already installed"
            echo "toolchain-installed=true" >> $GITHUB_OUTPUT
          else
            echo "Toolchain is not yet installed"
            echo "toolchain-installed=false" >> $GITHUB_OUTPUT
          fi

      - name: 'Install toolchain and dependencies'
        run: |
          '/c/Program Files (x86)/Microsoft Visual Studio/Installer/vs_installer.exe' \
            modify --quiet --installPath 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise' \
            --add Microsoft.VisualStudio.Component.VC.14.44.x86.x64
        if: steps.toolchain-check.outputs.toolchain-installed != 'true'

      - name: 'Configure'
        run: >
          bash configure
          --with-conf-name=windows-x64
          ${{ matrix.flags }}
          --with-version-opt=${GITHUB_ACTOR}-${GITHUB_SHA}
          --with-boot-jdk=${{ steps.bootjdk.outputs.path }}
          --with-msvc-toolset-version=14.44
          --with-jmod-compress=zip-1 || (
          echo "Dumping config.log:" &&
          cat config.log &&
          exit 1)
        env:
          # OpenJDK's Windows workflow intentionally supplies only GITHUB_PATH.
          PATH: ''
        shell: env /usr/bin/bash --login -eo pipefail {0}

      - name: 'Build'
        id: build
        uses: ./.github/actions/do-build
        with:
          make-target: 'product-bundles'
          platform: windows-x64
          debug-suffix: '${{ matrix.suffix }}'

      - name: 'Upload bundles'
        uses: ./.github/actions/upload-bundles
        with:
          platform: windows-x64
          debug-suffix: '${{ matrix.suffix }}'
